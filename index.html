    <title>Document</title>
</head>
<body>

    <!-- Variable and Data Types -->
    <script>
        const name = "John"; // String
        name = "Peñaflor"; // Reassigning a new string value
        console.log("Name:", name);

        // Name
        const age = 28 
        // string
        const last_name = "Peñaflor"
        // boolean
        const isStudent = true
        const isGraduated = false
        // array
        const hobbies = ["reading", "traveling", "coding"];
        // object
        const person = {

            age: 28,

        };
    </script>

    <!-- Functions -->
    <script>
        function greet(name) {
            return `Hello, ${name}!`;
        }

        const greeting = greet("John");
        console.log(greeting);


        // arrow function
        const add = (a, b) => a + b;
        console.log("Sum:", add(5, 3));

    </script>

    <!-- array and map() -->
     <script>

        const skillList = skill.map((skill) => console.log(skill));
        
     </script>
